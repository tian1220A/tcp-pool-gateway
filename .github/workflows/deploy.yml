name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Build Rust backend
        run: cargo build --release -p gateway -p mock-server -p demo-client

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host deploy\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking accept-new\n' \
            "$SERVER_HOST" "$SERVER_USER" > ~/.ssh/config

          # Prepare directories on the server (clean out stale frontend assets).
          ssh deploy 'rm -rf /root/tcp-pool-gateway/frontend/dist && mkdir -p /root/tcp-pool-gateway/target/release /root/tcp-pool-gateway/frontend/dist'

          # Upload binaries and frontend bundle.
          scp target/release/gateway target/release/mock-server target/release/demo-client \
            deploy:/root/tcp-pool-gateway/target/release/
          scp -r frontend/dist/. deploy:/root/tcp-pool-gateway/frontend/dist/

          # Restart services.
          ssh deploy 'set -e
            cd /root/tcp-pool-gateway
            chmod +x target/release/gateway target/release/mock-server target/release/demo-client
            pkill -x gateway || true
            pkill -x mock-server || true
            sleep 1
            (nohup ./target/release/mock-server --listen 127.0.0.1:9000 --latency-ms 5 >> mock-server.log 2>&1 &)
            (nohup ./target/release/gateway --backend 127.0.0.1:9000 --tcp-listen 0.0.0.0:8000 --http-listen 0.0.0.0:8080 >> gateway.log 2>&1 &)
            sleep 2
            echo "--- gateway ---"; pgrep -a -x gateway
            echo "--- mock-server ---"; pgrep -a -x mock-server
            echo "--- health ---"; curl -sf http://127.0.0.1:8080/api/pool/stats | head -c 300; echo
          '
